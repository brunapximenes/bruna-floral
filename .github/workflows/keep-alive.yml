name: Supabase Keep-Alive

on:
  schedule:
    - cron: '17 */12 * * *'   # 2x por dia (a cada 12h) — bastante margem contra a pausa de 7 dias
  workflow_dispatch:           # permite disparar manualmente pelo GitHub (aba Actions → Run workflow)

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (gera atividade no projeto)
        run: |
          BASE="https://jimkkxlrrsjdylrccnpb.supabase.co"
          KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImppbWtreGxycnNqZHlscmNjbnBiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2MDgzNjAsImV4cCI6MjA5NjE4NDM2MH0.Vjhy8qQlYfQMG7gvaxIVrvsrMhRcRaMV2eMQDvZCyg0"
          # 1) health do Auth (responde 200 mesmo sem chave)
          H=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/auth/v1/health")
          echo "auth/health: $H"
          # 2) consulta real na tabela (passa pelo Postgres via PostgREST)
          R=$(curl -s -o /dev/null -w "%{http_code}" \
            "$BASE/rest/v1/events?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "rest/events: $R"
          # Nunca falha o job: o que importa é ter gerado a requisição (keep-alive)
          echo "Ping concluído."
