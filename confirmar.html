<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirmação de presença — Bruna Ximenes</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --verde:#3d5a47; --verde-claro:#6b8f72; --rosa:#c9847a;
    --creme:#faf7f2; --creme2:#f2ede4; --texto:#2a2a2a; --texto2:#6b6b6b; --borda:#ddd6cc;
    --cf-accent:#3d5a47;   /* cor do texto em destaque (títulos/rótulos) */
    --cf-btn:#3d5a47;      /* cor dos botões */
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; font-family:'Jost',sans-serif; color:var(--texto);
    background:var(--verde);
    display:flex; align-items:center; justify-content:center; padding:24px 16px;
  }
  .cf-wrap{ width:100%; max-width:440px; }
  .cf-top{ text-align:center; margin-bottom:18px; }
  .cf-top .marca{ font-family:'Cormorant Garamond',serif; font-size:26px; color:#fff; font-weight:400; letter-spacing:.02em; }
  .cf-top .marca small{ display:block; font-family:'Jost',sans-serif; font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:rgba(255,255,255,.72); margin-top:2px; }
  .cf-card{
    background:var(--creme); border-radius:18px; padding:30px 26px 26px;
    box-shadow:0 14px 40px rgba(0,0,0,.18);
  }
  #cf-evento{ font-family:'Cormorant Garamond',serif; font-size:25px; font-weight:500; color:var(--cf-accent); text-align:center; margin:0 0 6px; line-height:1.2; }
  #cf-sub{ text-align:center; font-size:13.5px; color:var(--texto2); margin:0 0 22px; line-height:1.5; }

  .cf-campo{ margin-bottom:16px; }
  .cf-campo label{ display:block; font-size:12.5px; color:var(--cf-accent); font-weight:500; margin-bottom:6px; }
  .cf-campo input[type=text], .cf-campo input[type=tel], .cf-campo input[type=number], .cf-campo textarea{
    width:100%; padding:12px 14px; font-family:'Jost',sans-serif; font-size:14px;
    border:1px solid var(--borda); border-radius:10px; background:#fff; color:var(--texto); outline:none;
  }
  .cf-campo input:focus, .cf-campo textarea:focus{ border-color:var(--verde-claro); box-shadow:0 0 0 3px rgba(107,143,114,.15); }
  .cf-campo textarea{ min-height:66px; resize:vertical; }

  .cf-vai{ display:flex; gap:10px; }
  .cf-vai label{
    flex:1; display:flex; align-items:center; justify-content:center; gap:7px;
    padding:13px 10px; border:1.5px solid var(--borda); border-radius:12px; background:#fff;
    cursor:pointer; font-size:14px; font-weight:500; color:var(--texto2); transition:.15s;
  }
  .cf-vai input{ display:none; }
  .cf-vai input:checked + span{ color:var(--cf-accent); }
  .cf-vai label:has(input:checked){ border-color:var(--cf-accent); background:var(--creme2); color:var(--cf-accent); }

  .cf-acomp{ display:flex; gap:12px; }
  .cf-acomp .cf-campo{ flex:1; margin-bottom:16px; }
  .cf-acomp input[type=number]{ text-align:center; }
  .cf-hint{ font-size:11px; color:#9a948b; margin-top:3px; }

  #cf-enviar{
    width:100%; padding:14px; border:none; border-radius:12px; background:var(--cf-btn); color:#fff;
    font-family:'Jost',sans-serif; font-size:15px; font-weight:500; cursor:pointer; margin-top:6px;
  }
  #cf-enviar:hover{ filter:brightness(0.93); }
  #cf-enviar:disabled{ opacity:.6; cursor:default; }
  .cf-erro{ color:#b8706a; font-size:13px; text-align:center; margin-top:12px; min-height:18px; }

  .cf-ok{ text-align:center; padding:14px 6px 8px; }
  .cf-ok-ic{ font-size:52px; line-height:1; margin-bottom:10px; }
  .cf-ok h2{ font-family:'Cormorant Garamond',serif; font-size:26px; color:var(--cf-accent); font-weight:500; margin:0 0 10px; }
  .cf-ok p{ font-size:14px; color:var(--texto2); margin:6px 0; line-height:1.5; }
  .cf-ok-sub{ color:var(--verde-claro); }

  .cf-convite{ display:block; width:100%; height:auto; border-radius:12px; margin:0 0 20px; box-shadow:0 4px 14px rgba(0,0,0,.12); }
</style>
</head>
<body>
  <div class="cf-wrap">
    <div class="cf-top">
      <div class="marca">Bruna Ximenes<small>Decoração de eventos</small></div>
    </div>
    <div class="cf-card" id="cf-card">
      <!--CF-CONVITE-->
      <h1 id="cf-evento">Confirme sua presença</h1>
      <p id="cf-sub">Preencha abaixo para confirmar sua presença.</p>

      <div class="cf-campo">
        <label for="cf-nome">Seu nome</label>
        <input id="cf-nome" type="text" placeholder="Nome e sobrenome" autocomplete="name">
      </div>

      <div class="cf-campo">
        <label>Você vai poder comparecer?</label>
        <div class="cf-vai">
          <label><input type="radio" name="cf-vai" value="sim" onchange="_toggleCampos()"><span>✓ Sim, vou!</span></label>
          <label><input type="radio" name="cf-vai" value="nao" onchange="_toggleCampos()"><span>Não vou poder</span></label>
        </div>
      </div>

      <div id="cf-bloco-acomp" style="display:none">
        <div class="cf-acomp">
          <div class="cf-campo">
            <label for="cf-adultos">Acompanhantes adultos</label>
            <input id="cf-adultos" type="number" min="0" value="0" inputmode="numeric">
            <div class="cf-hint">além de você</div>
          </div>
          <div class="cf-campo">
            <label for="cf-criancas">Crianças</label>
            <input id="cf-criancas" type="number" min="0" value="0" inputmode="numeric">
          </div>
        </div>
        <div class="cf-campo">
          <label for="cf-tel">Telefone (opcional)</label>
          <input id="cf-tel" type="tel" placeholder="(81) 9 9999-9999" autocomplete="tel">
        </div>
        <div class="cf-campo">
          <label for="cf-recado">Recado (opcional)</label>
          <textarea id="cf-recado" placeholder="Alguma observação? (ex.: restrição alimentar)"></textarea>
        </div>
      </div>

      <button id="cf-enviar" onclick="enviarConfirmacao()">Confirmar</button>
      <div class="cf-erro" id="cf-erro"></div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/js/config.js"></script>
<script src="/js/supabase-client.js"></script>
<script src="/js/confirmar.js?v=1"></script>
</body>
</html>
